[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq-modernize"
version = "0.1.0"
description = "Translate legacy RNA-seq commands (TopHat, Cufflinks, Bowtie) to modern equivalents. Text only, never executes anything."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
rnaseq-modernize = "rnaseq_modernize.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rnaseq_modernize = ["rules/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
