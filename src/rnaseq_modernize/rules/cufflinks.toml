# DRAFT rules. checked=false until a human has compared each rule with the cited manual.
[tool]
legacy = "cufflinks"
modern = "stringtie"
versions = "Cufflinks manual page (no version shown, (c) 2017); StringTie manual (no version shown) and GitHub README"
notes = [
  "StringTie and Cufflinks are different assemblers. Transcripts and expression values will differ.",
  "The input accepted_hits.bam is a TopHat output and will not exist after a HISAT2 run; use the sorted BAM made from the HISAT2 SAM. Without -o, StringTie writes the GTF to stdout (StringTie manual).",
  "Both need coordinate-sorted alignments. Sort HISAT2 output with samtools first.",
  "StringTie reports TPM as well as FPKM. No documented StringTie replacement for genes.fpkm_tracking or isoforms.fpkm_tracking was found: gene abundances are written with -A, transcript values are in the -o GTF (both mappings are this tool's inference; StringTie does not name them as replacements).",
]

[[layout]]
names = ["bam"]
out = ["stringtie", "{bam}"]
note = ""
source = "https://ccb.jhu.edu/software/stringtie/index.shtml?t=manual"
checked = false

[[flag]]
names = ["-o"]
takes_value = true
modern = ["-o", "{value}/transcripts.gtf"]
closeness = "approximate"
note = "Cufflinks -o/--output-dir writes all output files to a directory (cufflinks.cpp help text; the Cufflinks manual page does not list it). StringTie -o is a GTF file name or path; StringTie creates missing directories (StringTie manual). The file name transcripts.gtf is this tool's choice."
legacy_source = "https://github.com/cole-trapnell-lab/cufflinks/blob/master/src/cufflinks.cpp"
modern_source = "https://ccb.jhu.edu/software/stringtie/index.shtml?t=manual"
checked = false
